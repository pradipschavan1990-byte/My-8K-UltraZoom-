name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create correct google-services.json
        run: |
          cat > app/google-services.json << 'EOF'
          {
            "project_info": {"project_number": "1234567890","project_id": "dummy","storage_bucket": "dummy.appspot.com"},
            "client": [{
              "client_info": {"mobilesdk_app_id": "1:123:android:abc","package_name": "com.aistudio.ultrazoom8k.kxmv"},
              "oauth_client": [],
              "api_key": [{"current_key": "AIzaDummy123"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          EOF
          cat app/google-services.json

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 8K-UltraZoom-APK
          path: app/build/outputs/apk/debug/app-debug.apk
