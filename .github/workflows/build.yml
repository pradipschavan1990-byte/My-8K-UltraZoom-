name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Fix Firebase and Keystore
        run: rm -rf app/google-services.json && echo '{"project_info":{"project_id":"ultrazoom8k-dummy","project_number":"1234567890","storage_bucket":"ultrazoom8k-dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:abc123def456","android_client_info":{"package_name":"com.aistudio.ultrazoom8k.kxmv"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKey123456"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json && keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug,OU=Debug,O=Debug,L=Debug,S=Debug,C=US"
      - uses: gradle/gradle-build-action@v3
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: 8K-UltraZoom-FULL-APK
          path: app/build/outputs/apk/debug/app-debug.apk
