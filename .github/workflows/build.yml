name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Create google-services.json with correct package
        run: |
          echo '{"project_info":{"project_number":"123456789","project_id":"ultrazoom-8k"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:abc123","package_name":"com.aistudio.ultrazoom8k.kxmv"},"oauth_client":[],"api_key":[{"current_key":"dummy_key"} Minu],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          cat app/google-services.json
      - name: Create debug keystore
        run: |
          keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          ls -la app/debug.keystore
          ls -la debug.keystore
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 8K-UltraZoom-APK
          path: app/build/outputs/apk/debug/app-debug.apk
